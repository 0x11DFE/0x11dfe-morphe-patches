name: Build patch bundle

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # MORPHE_TOKEN = classic PAT with read:packages, needed to resolve the
      # app.morphe.patches Gradle plugin from GitHub Packages (MorpheApp/registry).
      # The default GITHUB_TOKEN cannot read packages from another repo.
      # ubuntu runners ship the Android SDK; ANDROID_HOME is already set.
      - name: Build .mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-patch-bundle
          path: |
            patches/build/libs/*.mpp
            patches-list.json
            patches-bundle.json

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patches/build/libs/*.mpp
            patches-list.json
            patches-bundle.json
