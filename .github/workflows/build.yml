name: Build patch bundle

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Morphe registry (maven.pkg.github.com/MorpheApp/registry) resolves for
      # the workflow's default GITHUB_TOKEN, same as every community patch repo.
      # GITHUB_ACTOR is provided by the runner automatically.
      - name: Build .mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-patch-bundle
          path: |
            patches/build/libs/*.mpp
            patches-list.json
            patches-bundle.json

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patches/build/libs/*.mpp
            patches-list.json
            patches-bundle.json
