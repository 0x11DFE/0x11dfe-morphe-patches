name: Build patch bundle

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Morphe registry (maven.pkg.github.com/MorpheApp/registry) resolves for
      # the workflow's default GITHUB_TOKEN, same as every community patch repo.
      # GITHUB_ACTOR is provided by the runner automatically.
      - name: Build .mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphe-patch-bundle
          path: |
            patches/build/libs/*.mpp
            patches-list.json
            patches-bundle.json

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patches/build/libs/*.mpp
            patches-list.json

      # Morphe Manager resolves a source by fetching patches-bundle.json from the
      # default branch root, so keep it committed and pointed at the new release.
      - name: Commit bundle metadata to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat > patches-bundle.json <<JSON
          {
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S)",
            "description": "Waypoint patches ${GITHUB_REF_NAME}",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/patches-${VERSION}.mpp",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          git commit -m "chore: bundle metadata for ${GITHUB_REF_NAME} [skip ci]" || true
          git push origin HEAD:main
